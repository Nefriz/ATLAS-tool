
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    location = /get_worlds {
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
    }

    location /worlds/ {
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
